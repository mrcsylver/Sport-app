# XcodeGen spec — the .xcodeproj is generated, never hand-edited or committed.
# Regenerate any time with:  cd ios && xcodegen
name: IronLeague
options:
  bundleIdPrefix: com.ironleague
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.1

targets:
  IronLeague:
    type: application
    platform: iOS
    sources:
      - path: IronLeague
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ironleague.app
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "13"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""          # Xcode fills this from your account
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Iron League
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
