# A nightly dump of the database, kept as a build artifact.
#
# A free Supabase project has NO backups. None. The dashboard's Backups page
# is a paid feature, and the docs tell free users to export their own. There
# are 2,400 workouts in there and the only copy of them is one accidental
# DELETE away from being gone.
#
# This is the cheapest honest fix: pg_dump on a schedule, into GitHub's
# artifact storage, which is free for a public repository and generous for a
# private one. A 13 MB database compresses to well under a megabyte, so
# ninety days of them costs nothing.
#
# ---------------------------------------------------------------------------
# SETUP — one secret, once.
#
#   1. Supabase dashboard -> the "Connect" button at the TOP of the page,
#      next to the branch name. (It is not under Settings any more.)
#   2. Pick "Session pooler". NOT "Direct connection".
#   3. Copy the whole URI and put your database password in place of
#      [YOUR-PASSWORD].
#   4. GitHub -> this repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret, named SUPABASE_DB_URL.
#
# WHY THE SESSION POOLER AND NOT THE DIRECT CONNECTION. On the free plan the
# direct endpoint (db.<ref>.supabase.co:5432) resolves to IPv6 only, and
# GitHub's hosted runners are IPv4-only — so a direct connection cannot be
# reached from here at all. The shared session pooler
# (aws-<n>-<region>.pooler.supabase.com:5432) is IPv4 on every plan, and
# Supabase's own migration guide says to use session mode for pg_dump. Note
# the username on that string is postgres.<project-ref>, not postgres; copy
# the whole thing rather than assembling it.
#
# The secret is a FULL-ACCESS database password. It is never printed: it is
# passed through the environment and GitHub masks secrets in logs. If this
# repository is public, make certain it is a repository secret and is not
# committed anywhere.
#
# TO RESTORE onto a fresh project:
#   gunzip -c ironleague-YYYY-MM-DD.sql.gz | psql "$NEW_DB_URL"
# The public schema restores cleanly. The auth schema may need a few lines
# commented out if the new project runs a different Postgres or GoTrue
# version — run it once without --single-transaction to find them.
# ---------------------------------------------------------------------------

name: Nightly database backup

on:
  schedule:
    # 03:17 UTC — off the hour on purpose, because everything else in the
    # world runs at :00 and the runners queue.
    - cron: '17 3 * * *'
  workflow_dispatch:        # and a button, for the first run and for a test

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install a matching pg_dump
        run: |
          # The server is Postgres 17.6. Ubuntu's default client is older,
          # and a pg_dump older than its server refuses outright rather than
          # producing a half-good dump.
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' \
            /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. See the comment at the"
            echo "::error::top of .github/workflows/backup.yml for the steps."
            exit 1
          fi
          # A direct-connection string cannot work from here: on the free plan
          # that host is IPv6-only and GitHub's runners are IPv4-only. Saying
          # so now beats a DNS error nobody reads in six weeks' time.
          case "$DB_URL" in
            *db.*.supabase.co*)
              echo "::error::That looks like the DIRECT connection string."
              echo "::error::On the free plan it is IPv6-only and GitHub runners"
              echo "::error::are IPv4-only, so it can never connect. Use the"
              echo "::error::Session pooler string from the Connect dialog:"
              echo "::error::  ...pooler.supabase.com:5432"
              exit 1 ;;
          esac
          # The runner ships postgresql-client-16 and Debian's /usr/bin/pg_dump
          # is a wrapper that kept resolving to it even with 17 installed
          # alongside -- and a pg_dump older than its server aborts rather
          # than producing a partial dump. So pick the newest binary by path
          # and never trust the wrapper.
          PGDUMP=$(ls -d /usr/lib/postgresql/*/bin/pg_dump 2>/dev/null | sort -V | tail -1)
          if [ -z "$PGDUMP" ]; then
            echo "::error::No pg_dump found under /usr/lib/postgresql/*/bin."
            exit 1
          fi
          echo "using $PGDUMP ($("$PGDUMP" --version))"

          STAMP=$(date -u +%Y-%m-%d)
          # --no-owner and --no-acl so the dump restores into a fresh project
          # whose roles are named differently. Schema and data together: a
          # backup you cannot restore without also finding the right schema.sql
          # is not a backup.
          "$PGDUMP" "$DB_URL" \
            --no-owner --no-acl \
            --schema=public --schema=auth \
            --file="ironleague-$STAMP.sql"

          # A backup nobody checks is a rumour. An empty or truncated dump
          # uploads just as happily as a good one, and you find out on the
          # day you need it, so the run fails here instead.
          WORKOUTS=$(grep -c '^COPY public.workouts' "ironleague-$STAMP.sql" || true)
          ROWS=$(awk '/^COPY public.workouts /{f=1;next} f&&/^\\\.$/{exit} f{n++} END{print n+0}' \
                 "ironleague-$STAMP.sql")
          echo "workouts COPY blocks: $WORKOUTS · rows: $ROWS"
          if [ "$WORKOUTS" -lt 1 ] || [ "$ROWS" -lt 1 ]; then
            echo "::error::The dump has no workout rows in it. Not uploading a"
            echo "::error::backup that would be useless on the day it is needed."
            exit 1
          fi
          echo "- Dumped **$ROWS workouts**" >> "$GITHUB_STEP_SUMMARY"

          gzip -9 "ironleague-$STAMP.sql"
          ls -lh ironleague-*.sql.gz
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: ironleague-db-${{ env.STAMP }}
          path: ironleague-*.sql.gz
          retention-days: 90
          if-no-files-found: error
